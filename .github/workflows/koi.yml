name: koi

on:
  schedule:
    - cron: '5 0 * * *' # Executa todo dia logo após a meia-noite (UTC)
  workflow_dispatch:      # Permite rodar manualmente pelo botão "Run workflow"

jobs:
  draw:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate first koi and setup tool
        uses: yalongwastaken/git-koi@v1
        with:
          login: ${{ github.repository_owner }}
          body: 'black'
          output-dir: 'koi/black'

      - name: Generate all other varieties
        run: |
          for body in asagi platinum white tea gold; do
            git-koi render "$RUNNER_TEMP/koi-snapshot.json" --output-dir "koi/$body" --body "$body"
          done

      - name: Commit updated koi if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add koi/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: tend the koi (all varieties)" && git push)
